name: Desktop screenshots

on:
  push:
    paths:
      - "app/ui/**"
      - "tools/screenshots.py"
      - ".github/workflows/desktop-screens.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render every page
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tools/screenshots.py /tmp/shots
          ls -la /tmp/shots
          test -s /tmp/shots/settings.png

      - name: Commit screenshots
        run: |
          cp /tmp/shots/*.png docs/screenshots/
          git config user.name "ci-bot"
          git config user.email "ci-bot@fidexe.local"
          git add docs/screenshots
          git commit -m "docs: regenerate desktop screenshots [skip ci]" || echo "nothing to commit"
          git push || true
