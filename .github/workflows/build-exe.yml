name: Build FIDEXE.exe

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          python -c "import PySide6, PyInstaller; print('PySide6', PySide6.__version__, 'PyInstaller', PyInstaller.__version__)"

      - name: Build single-file exe
        run: pyinstaller --noconfirm --clean build.spec

      - name: Headless self-test of the frozen app
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\FIDEXE.exe" -ArgumentList "--selftest" -PassThru -Wait -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "selftest failed with exit code $($process.ExitCode)" }

      - name: Show artifact size
        shell: pwsh
        run: Get-Item dist\FIDEXE.exe | Select-Object Name, @{n = 'SizeMB'; e = { [math]::Round($_.Length / 1MB, 1) } }

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: FIDEXE-windows-exe
          path: dist/FIDEXE.exe
          if-no-files-found: error
          retention-days: 30
