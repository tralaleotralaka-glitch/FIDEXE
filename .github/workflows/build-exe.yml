name: Build Windows EXE

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build LapPulse.exe
        run: |
          pyinstaller --onefile --noconsole --name LapPulse --add-data "static;static" app.py

      - name: Upload LapPulse.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: LapPulse-Windows-EXE
          path: dist/LapPulse.exe
