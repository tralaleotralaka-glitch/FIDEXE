name: Build FIDEXE.exe

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          python -c "import PySide6, PyInstaller; print('PySide6', PySide6.__version__, 'PyInstaller', PyInstaller.__version__)"

      - name: Source smoke test (auth, clipboard, usage, export, themes)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/smoke_test.py

      - name: LAN remote-control API test (Android protocol)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/remote_test.py

      - name: Build single-file exe
        run: pyinstaller --noconfirm --clean build.spec

      - name: Check the webcam module inside the exe
        shell: pwsh
        run: |
          $output = & ".\dist\FIDEXE.exe" --camera-check 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "opencv is not bundled into the exe" }
          if ($output -notmatch "opencv: \d") { throw "opencv version was not reported" }

      - name: Headless self-test of the frozen app
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\FIDEXE.exe" -ArgumentList "--selftest" -PassThru -Wait -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "selftest failed with exit code $($process.ExitCode)" }

      - name: Verify rendered UI screenshots from the frozen app
        shell: pwsh
        run: |
          $shots = Get-ChildItem "$env:APPDATA\FIDEXE\selftest_*.png" -ErrorAction SilentlyContinue
          if ($shots.Count -lt 4) { throw "expected 4 rendered pages, got $($shots.Count)" }
          foreach ($shot in $shots) {
            if ($shot.Length -lt 5000) { throw "page render too small: $($shot.Name) $($shot.Length) bytes" }
          }
          $shots | Select-Object Name, Length | Format-Table

      - name: Show artifact details
        id: details
        shell: pwsh
        run: |
          $file = Get-Item dist\FIDEXE.exe
          $hash = (Get-FileHash dist\FIDEXE.exe -Algorithm SHA256).Hash.ToLower()
          $size = [math]::Round($file.Length / 1MB, 1)
          "size_mb=$size" | Out-File -Append $env:GITHUB_OUTPUT
          "sha256=$hash" | Out-File -Append $env:GITHUB_OUTPUT
          "| FIDEXE.exe | $size MB | ``$hash`` |" | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: FIDEXE-windows-exe
          path: dist/FIDEXE.exe
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release with the exe
        if: github.ref_name == 'arena/e4167a20-fidexe'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIZE_MB: ${{ steps.details.outputs.size_mb }}
          SHA256: ${{ steps.details.outputs.sha256 }}
        run: |
          $notes = @"
          **FIDEXE 2.1.0** — история буфера обмена и статистика приложений для Windows 10/11.

          ### Как запустить
          1. Скачайте `FIDEXE.exe` ниже.
          2. Запустите — установка не нужна, прав администратора тоже.
          3. Windows SmartScreen может показать предупреждение, потому что файл не подписан сертификатом:
             «Подробнее» → «Выполнить в любом случае».

          ### Что внутри
          - история буфера обмена: текст, ссылки, код, изображения, поиск, закрепление, экспорт;
          - статистика приложений: время в фокусе по дням, топ приложений, ритм дня;
          - локальный вход по почте (PBKDF2-SHA256), гостевой режим;
          - тёмная и светлая темы, автозапуск, трей, горячие клавиши;
          - управление с телефона: блокировка компьютера из Android-приложения по Wi-Fi;
          - в настройках ноутбука остались только 6 цифр для входа с телефона (меняются каждую
            минуту): сервер для телефона стартует сам после входа по почте, включать ничего не нужно;
          - просмотр веб-камеры ноутбука с телефона и закрытие программ из списка открытых окон.

          Данные хранятся только на вашем компьютере в ``%APPDATA%\FIDEXE``, интернет не используется.

          **Размер:** $env:SIZE_MB МБ · **SHA256:** ``$env:SHA256``
          "@
          $notes | Out-File -Encoding utf8 release-notes.md
          gh release view v2.1.0 *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v2.1.0 "dist\FIDEXE.exe" --title "FIDEXE 2.1.0 — Windows exe" --notes-file release-notes.md
          } else {
            gh release upload v2.1.0 "dist\FIDEXE.exe" --clobber
            gh release edit v2.1.0 --notes-file release-notes.md
          }
