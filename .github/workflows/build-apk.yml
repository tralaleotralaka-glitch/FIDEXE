name: Build FIDEXE Remote APK

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          echo "--- sdk contents ---"
          ls "$SDK" || true
          SDKMAN=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: $SDKMAN"
          if [ -n "$SDKMAN" ]; then
            "$SDKMAN" --version || true
            (yes | "$SDKMAN" --licenses > /dev/null 2>&1) || true
            "$SDKMAN" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          fi
          echo "--- platforms ---"
          ls "$SDK/platforms" || true
          echo "--- build-tools ---"
          ls "$SDK/build-tools" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log

      - name: Publish build log to the branch on failure
        if: failure() && github.event_name == 'workflow_dispatch'
        run: |
          if [ -f android/build.log ]; then
            {
              grep -nE "error:|What went wrong|Execution failed|Caused by|FAILURE|A problem occurred|> Task .*FAILED" -A 3 android/build.log | head -400
              echo "---------- last lines ----------"
              tail -40 android/build.log
            } > android/build-log.txt
            git config user.name "ci-bot"
            git config user.email "ci-bot@fidexe.local"
            git add android/build-log.txt
            git commit -m "ci: gradle failure log [skip ci]" || true
            git push || true
          fi

      - name: Verify APK signature and metadata
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -la "$(dirname "$APK")"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/aapt2" dump badging "$APK" | head -6
          "$BT/apksigner" verify --print-certs "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FIDEXE-Remote-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK release
        if: github.ref_name == 'arena/e4167a20-fidexe'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk FIDEXE-Remote-2.0.0.apk
          sha256sum FIDEXE-Remote-2.0.0.apk
          gh release view android-v2.0.0 > /dev/null 2>&1 || \
            gh release create android-v2.0.0 --title "FIDEXE Remote 2.0.0 — Android" --notes-file android/RELEASE_NOTES.md
          gh release upload android-v2.0.0 FIDEXE-Remote-2.0.0.apk --clobber
          gh release edit android-v2.0.0 --notes-file android/RELEASE_NOTES.md
