name: Android UI screenshots

on:
  push:
    paths:
      - ".github/workflows/android-screens.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMAN=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMAN" ]; then
            (yes | "$SDKMAN" --licenses > /dev/null 2>&1) || true
            "$SDKMAN" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start mock desktop API
        run: |
          nohup python3 tools/mock_remote.py --port 47811 > /tmp/mock.log 2>&1 &
          sleep 2
          curl -s http://127.0.0.1:47811/api/info; echo

      - name: Boot emulator, log in with the desktop code and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            mkdir -p docs/android
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb shell am start -n app.fidexe.remote/.MainActivity
            sleep 6
            python3 tools/android_ui.py shot docs/android/connect.png

            python3 tools/android_ui.py tap-edit 0
            python3 tools/android_ui.py type "10.0.2.2:47811"
            python3 tools/android_ui.py hide-keyboard

            CODE=$(curl -s http://127.0.0.1:47811/api/demo/code | python3 -c "import json,sys;print(json.load(sys.stdin)['code'])")
            echo "pairing code from the mock desktop: $CODE"
            python3 tools/android_ui.py tap-edit 1
            python3 tools/android_ui.py type "$CODE"
            python3 tools/android_ui.py hide-keyboard
            python3 tools/android_ui.py shot docs/android/filled.png
            python3 tools/android_ui.py tap-text "Войти по коду"
            sleep 10
            python3 tools/android_ui.py shot docs/android/control.png
            python3 tools/android_ui.py tap-text "Заблокировать ноутбук"
            sleep 4
            python3 tools/android_ui.py shot docs/android/locked.png
            echo "--- mock log ---"
            cat /tmp/mock.log
            echo "--- lock state ---"
            curl -s http://127.0.0.1:47811/api/state; echo
            echo "--- code login worked ---"
            grep -c "phone paired with code" /tmp/mock.log || true

      - name: Commit screenshots
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@fidexe.local"
          git add docs/android
          git commit -m "docs: android UI screenshots [skip ci]" || echo "nothing to commit"
          git push || true
