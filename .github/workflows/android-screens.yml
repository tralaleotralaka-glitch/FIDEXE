name: Android UI screenshots

on:
  push:
    paths:
      - ".github/workflows/android-screens.yml"
      - "android/**"
      - "tools/android_flow.sh"
      - "tools/android_ui.py"
      - "tools/mock_remote.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMAN=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMAN" ]; then
            (yes | "$SDKMAN" --licenses > /dev/null 2>&1) || true
            "$SDKMAN" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start mock desktop API
        run: |
          nohup python3 tools/mock_remote.py --port 47811 > /tmp/mock.log 2>&1 &
          sleep 2
          curl -s http://127.0.0.1:47811/api/info; echo

      - name: Boot emulator, log in with the desktop code and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/android_flow.sh

      - name: Publish the emulator log on failure
        if: failure()
        run: |
          {
            echo "# emulator UI test log"
            echo
            echo "devices: $(adb devices | tr '\n' ' ')"
            echo
            echo '## mock desktop'
            tail -n 80 /tmp/mock.log 2>/dev/null
            echo
            echo '## flow log'
            tail -n 120 /tmp/flow.log 2>/dev/null
            echo
            echo '## connect screen dump'
            head -n 80 /tmp/ui-connect.txt 2>/dev/null
            echo
            echo '## control screen dump'
            head -n 80 /tmp/ui-control.txt 2>/dev/null
            echo
            echo '## logcat (app)'
            timeout 25 adb logcat -d -t 300 2>&1 | grep -iE "fidexe|AndroidRuntime" | tail -n 120
          } > screens-log.md || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@fidexe.local"
          git add -f screens-log.md
          git commit -m "ci: android UI test log [skip ci]" || echo "nothing to commit"
          timeout 60 git pull --rebase --quiet origin "${GITHUB_REF_NAME}" || true
          timeout 120 git push || true

      - name: Commit screenshots
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@fidexe.local"
          git add docs/android
          git commit -m "docs: android UI screenshots [skip ci]" || echo "nothing to commit"
          git pull --rebase --quiet origin "${GITHUB_REF_NAME}" || true
          git push || true
