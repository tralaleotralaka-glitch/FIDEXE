name: Android UI screenshots

on:
  push:
    paths:
      - ".github/workflows/android-screens.yml"
      - "android/**"
      - "tools/android_flow.sh"
      - "tools/android_ui.py"
      - "tools/mock_remote.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMAN=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMAN" ]; then
            (yes | "$SDKMAN" --licenses > /dev/null 2>&1) || true
            "$SDKMAN" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the relay helpers
        run: pip install paho-mqtt==1.6.1 cryptography==43.0.3

      - name: Start mock desktop API
        env:
          FIDEXE_RELAY_ID: ci-relay-demo-link
          FIDEXE_RELAY_KEY: 6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f
          FIDEXE_RELAY_BROKERS: broker.hivemq.com:8883,broker.emqx.io:8883,test.mosquitto.org:8883
        run: |
          nohup python3 tools/mock_remote.py --port 47811 > /tmp/mock.log 2>&1 &
          sleep 2
          curl -s http://127.0.0.1:47811/api/info; echo

      - name: Start the far-away laptop (public MQTT relay)
        env:
          FIDEXE_RELAY_ID: ci-relay-demo-link
          FIDEXE_RELAY_KEY: 6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f6f
          FIDEXE_DEMO_TOKEN: demo-token-for-ci
          FIDEXE_RELAY_BROKERS: broker.hivemq.com:8883,broker.emqx.io:8883,test.mosquitto.org:8883
        run: |
          nohup python3 tools/relay_host.py > /tmp/relay-host.out 2>&1 &
          for i in $(seq 1 20); do
            grep -q "READY" /tmp/relay.log 2>/dev/null && break
            sleep 1
          done
          cat /tmp/relay.log || true
          grep -q "READY" /tmp/relay.log || echo "::warning::the public broker did not answer, the relay test will fail"

      - name: Boot emulator, log in with the desktop code and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/android_flow.sh

      - name: Publish the emulator log on failure
        if: failure()
        run: |
          {
            echo "# emulator UI test log"
            echo
            echo "devices: $(adb devices | tr '\n' ' ')"
            echo
            echo '## mock desktop'
            tail -n 80 /tmp/mock.log 2>/dev/null
            echo
            echo '## flow log'
            tail -n 120 /tmp/flow.log 2>/dev/null
            echo
            echo '## connect screen dump'
            head -n 80 /tmp/ui-connect.txt 2>/dev/null
            echo
            echo '## control screen dump'
            head -n 80 /tmp/ui-control.txt 2>/dev/null
            echo
            echo '## logcat (app)'
            timeout 25 adb logcat -d -t 300 2>&1 | grep -iE "fidexe|AndroidRuntime" | tail -n 120
          } > screens-log.md || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@fidexe.local"
          git add -f screens-log.md
          git commit -m "ci: android UI test log [skip ci]" || echo "nothing to commit"
          for attempt in 1 2 3 4; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" || true
            if timeout 90 git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::the screenshots were produced but could not be pushed"
          exit 1

      - name: Commit screenshots
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@fidexe.local"
          git add -A docs/android
          if git diff --cached --quiet; then
            echo "screenshots are unchanged"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "docs: android UI screenshots [skip ci]"
          export GIT_TERMINAL_PROMPT=0
          dirty=$(git status --porcelain | head -20 | tr '\n' ' ')
          if [ -n "$dirty" ]; then
            echo "::warning title=files changed by the emulator::$dirty"
          fi
          # the emulator and gradle touch a few tracked files: keep only our commit
          git checkout -- . || true
          git status --porcelain | head -5 || true
          for attempt in 1 2 3 4; do
            git rebase --abort >/dev/null 2>&1 || true
            fetch_log=$(timeout 60 git fetch origin "${GITHUB_REF_NAME}" 2>&1) \
              || echo "::error title=fetch ${attempt}::${fetch_log}"
            rebase_log=$(timeout 60 git rebase "origin/${GITHUB_REF_NAME}" 2>&1) || {
              echo "::error title=rebase ${attempt}::${rebase_log}"
              git rebase --abort >/dev/null 2>&1 || true
              sleep 5
              continue
            }
            push_log=$(timeout 90 git push origin "HEAD:${GITHUB_REF_NAME}" 2>&1) && {
              echo "pushed on attempt ${attempt}"
              exit 0
            }
            echo "::error title=push ${attempt}::${push_log}"
            sleep 10
          done
          echo "::error::the screenshots were produced but could not be pushed"
          exit 1
