plugins {
    id 'com.android.application'
}

def keystoreFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'app.fidexe.remote'
    compileSdk 34

    defaultConfig {
        applicationId "app.fidexe.remote"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "2.3.0"
    }

    signingConfigs {
        release {
            def storePath = keystoreProps.getProperty("storeFile")
            if (storePath != null && rootProject.file(storePath).exists()) {
                storeFile rootProject.file(storePath)
                storePassword keystoreProps.getProperty("storePassword")
                keyAlias keystoreProps.getProperty("keyAlias")
                keyPassword keystoreProps.getProperty("keyPassword")
                storeType keystoreProps.getProperty("storeType", "PKCS12")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (!keystoreProps.isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // MQTT over TLS: the encrypted channel that works from any distance
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
}
